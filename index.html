<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐旅概論雲端闖關與檢測系統 - 入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Load Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <style>
        /* ================= THEME DEFINITIONS ================= */
        :root, [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #e2e8f0 0%, #f8fafc 85%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(99, 102, 241, 0.2);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --text-main: #0f172a;
            --text-muted: #475569;
            --surface-hover: rgba(79, 70, 229, 0.05);
            --input-bg: #ffffff;
            --modal-bg: #ffffff;
            --table-header: rgba(79, 70, 229, 0.08);
        }

        [data-theme="midnight"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 85%);
            --card-bg: rgba(22, 27, 46, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success: #10b981;
            --error: #ef4444;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --surface-hover: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(11, 15, 25, 0.7);
            --modal-bg: #15192b;
            --table-header: rgba(255, 255, 255, 0.05);
        }

        [data-theme="ocean"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #0c3359 0%, #051324 85%);
            --card-bg: rgba(12, 38, 66, 0.65);
            --card-border: rgba(56, 189, 248, 0.15);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.35);
            --success: #06b6d4;
            --error: #f43f5e;
            --warning: #facc15;
            --text-main: #f0f9ff;
            --text-muted: #7dd3fc;
            --surface-hover: rgba(56, 189, 248, 0.08);
            --input-bg: rgba(5, 19, 36, 0.7);
            --modal-bg: #092038;
            --table-header: rgba(56, 189, 248, 0.08);
        }

        [data-theme="forest"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #064e3b 0%, #02241b 85%);
            --card-bg: rgba(6, 60, 46, 0.65);
            --card-border: rgba(52, 211, 153, 0.15);
            --primary: #059669;
            --primary-hover: #047857;
            --primary-glow: rgba(5, 150, 105, 0.35);
            --success: #34d399;
            --error: #fb7185;
            --warning: #fde047;
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --surface-hover: rgba(52, 211, 153, 0.08);
            --input-bg: rgba(2, 36, 27, 0.7);
            --modal-bg: #043629;
            --table-header: rgba(52, 211, 153, 0.08);
        }

        [data-theme="sunset"] {
            --bg-gradient: radial-gradient(circle at 50% 20%, #4a044e 0%, #1a0320 85%);
            --card-bg: rgba(58, 6, 61, 0.65);
            --card-border: rgba(244, 114, 182, 0.15);
            --primary: #c026d3;
            --primary-hover: #a21caf;
            --primary-glow: rgba(192, 38, 211, 0.35);
            --success: #10b981;
            --error: #f43f5e;
            --warning: #fbbf24;
            --text-main: #fdf4ff;
            --text-muted: #f0abfc;
            --surface-hover: rgba(244, 114, 182, 0.08);
            --input-bg: rgba(26, 3, 32, 0.7);
            --modal-bg: #350438;
            --table-header: rgba(244, 114, 182, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Theme Picker Bar */
        .theme-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .theme-dot:hover { transform: scale(1.15); }
        .theme-dot.active { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); transform: scale(1.1); }

        .dot-light { background: linear-gradient(135deg, #ffffff, #94a3b8); border: 1px solid #cbd5e1; }
        .dot-midnight { background: linear-gradient(135deg, #1e1b4b, #6366f1); }
        .dot-ocean { background: linear-gradient(135deg, #0c3359, #0284c7); }
        .dot-forest { background: linear-gradient(135deg, #064e3b, #10b981); }
        .dot-sunset { background: linear-gradient(135deg, #4a044e, #c026d3); }

        .container {
            width: 100%;
            max-width: 860px;
        }

        .portal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 0 40px var(--primary-glow);
            position: relative;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid var(--primary-glow);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-align: center;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-container {
            display: grid;
            grid-template-columns: 1.15fr 1.85fr;
            gap: 32px;
            align-items: stretch;
        }

        @media (max-width: 768px) {
            .auth-container { grid-template-columns: 1fr; }
            .portal-card { padding: 24px 20px; }
        }

        .auth-card {
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 13px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 14px var(--primary-glow);
        }

        .alert-box {
            background: rgba(217, 119, 6, 0.1);
            border: 1px solid rgba(217, 119, 6, 0.3);
            color: var(--warning);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px var(--primary-glow);
            text-align: center;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .leaderboard-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .leaderboard-tabs {
            display: flex;
            background: var(--surface-hover);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            margin-bottom: 15px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 3px 10px var(--primary-glow);
        }

        .table-responsive {
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background: var(--surface-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--table-header);
            color: var(--text-muted);
            font-weight: 700;
            padding: 12px 14px;
            font-size: 0.82rem;
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--card-border);
            z-index: 1;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.88rem;
        }

        tr:hover { background: var(--surface-hover); }

        .rank-cell {
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.82rem;
        }
        .rank-1 { background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.4)); color: #b45309; border: 1.5px solid #f59e0b; }
        .rank-2 { background: linear-gradient(135deg, rgba(156, 163, 175, 0.3), rgba(107, 114, 128, 0.4)); color: #475569; border: 1.5px solid #94a3b8; }
        .rank-3 { background: linear-gradient(135deg, rgba(217, 119, 6, 0.3), rgba(180, 83, 9, 0.4)); color: #c2410c; border: 1.5px solid #ea580c; }

        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            width: 100%;
            max-width: 460px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-bar">
        <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted);">🎨 底色：</span>
        <div class="theme-dot dot-light active" title="晨曦明亮 (預設白色底)" onclick="setTheme('light')"></div>
        <div class="theme-dot dot-midnight" title="星空暗夜" onclick="setTheme('midnight')"></div>
        <div class="theme-dot dot-ocean" title="沉靜湛藍" onclick="setTheme('ocean')"></div>
        <div class="theme-dot dot-forest" title="森林翡翠" onclick="setTheme('forest')"></div>
        <div class="theme-dot dot-sunset" title="暮光幻紫" onclick="setTheme('sunset')"></div>
    </div>

    <div class="container">
        <div class="portal-card">
            <div style="text-align: center;">
                <span class="hero-badge">🎯 116統測・升學衝刺・全真題庫</span>
                <h1>餐旅概論雲端闖關系統</h1>
                <div class="subtitle">全國高中職學生線上學習、小考與全真模擬測驗</div>
            </div>

            <div class="auth-container">
                <!-- Authentication Form -->
                <div class="auth-card">
                    <h3 style="font-weight: 800; color: var(--text-main); text-align: center; margin-bottom: 2px;">學生登入</h3>
                    <div style="font-size:0.8rem; text-align:center; color:var(--text-muted); margin-bottom:12px;">首次輸入帳密即自動註冊</div>
                    
                    <div class="form-group">
                        <label for="username">👤 學生帳號</label>
                        <input type="text" id="username" class="form-control" placeholder="自訂帳號 (英數字/身分證)..." required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">🔒 登入密碼</label>
                        <input type="password" id="password" class="form-control" placeholder="自訂密碼..." required autocomplete="current-password">
                    </div>

                    <div class="alert-box">
                        ⚠️ **重要提醒**：初次登入設定的密碼請務必牢記，本系統無法重設密碼！
                    </div>

                    <button onclick="handleLogin()" class="btn">🚀 登入 / 開始挑戰</button>
                    <div style="text-align: center; margin-top: 5px;">
                        <a href="#" onclick="openTeacherLogin()" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none; font-weight: 600;">💼 教師/管理員後台</a>
                    </div>
                </div>

                <!-- Leaderboard Section -->
                <div>
                    <div class="leaderboard-title">
                        <span>🏆</span> 實時總積分榮譽榜

                    <div class="leaderboard-tabs">

                        <button id="tabMySchool" class="tab-btn" onclick="switchTab('school')">校內排行</button>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 15%; text-align: center;">名次</th>
                                    <th style="width: 38%;">學校名稱</th>
                                    <th style="width: 25%;">姓名/暱稱</th>
                                    <th style="width: 22%; text-align: right;">總積分</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">載入即時排名中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-bottom: 8px; font-weight: 800; color: var(--text-main); text-align: center;">🆕 新使用者註冊</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center;">系統偵測到此帳號為第一次使用，請選擇學校與填寫姓名：</p>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="regRegion">📍 學校區域</label>
                <select id="regRegion" class="form-control" onchange="updateSchoolDropdown()">
                    <option value="">-- 請選擇區域 --</option>
                    <option value="north">北區 (基宜雙北桃竹)</option>
                    <option value="central">中區 (苗中彰投雲)</option>
                    <option value="south">南區 (嘉台高屏)</option>
                    <option value="east_islands">東區及離島 (花東澎金)</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="regSchool">🏫 學校名稱</label>
                <select id="regSchool" class="form-control" onchange="checkSchoolManual()">
                    <option value="">-- 請先選擇區域 --</option>
                </select>
            </div>

            <div class="form-group" id="regSchoolManualContainer" style="margin-bottom: 15px; display: none;">
                <label for="regSchoolManual" style="color: var(--warning);">✍️ 手動輸入校名</label>
                <input type="text" id="regSchoolManual" class="form-control" placeholder="請輸入完整校名...">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="regName">🏷️ 學生姓名 / 暱稱</label>
                <input type="text" id="regName" class="form-control" placeholder="例：王小明...">
            </div>

            <div class="alert-box" style="margin-bottom: 20px; text-align: left;">
                🚨 您的帳號為 <strong id="regUsernameLabel" style="color: var(--text-main);"></strong>，密碼無法補發，請再次確認牢記！
            </div>

            <div style="display: flex; gap: 12px;">
                <button onclick="closeRegisterModal()" class="btn" style="flex: 1; background: var(--surface-hover); border: 1px solid var(--card-border); color: var(--text-main); box-shadow: none;">返回</button>
                <button onclick="submitRegister()" class="btn" style="flex: 1; background: var(--success); box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);">完成註冊並登入</button>
            </div>
        </div>
    </div>

    <!-- Teacher Password Modal -->
    <div id="passwordModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 380px;">
            <h3 style="margin-bottom: 8px; font-weight: 800; color: var(--text-main); text-align: center;">💼 教師密碼驗證</h3>
            <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 18px; text-align: center;">請輸入管理密碼進入教師後台：</p>

            <div id="passwordError" style="color: var(--error); font-size: 0.85rem; margin-top: -12px; margin-bottom: 15px; display: none; text-align: center; font-weight: bold;">密碼錯誤，請重新輸入！</div>
            <div style="display: flex; gap: 12px;">
                <button onclick="closePasswordModal()" class="btn" style="flex: 1; background: var(--surface-hover); border: 1px solid var(--card-border); color: var(--text-main); box-shadow: none;">取消</button>
                <button onclick="submitPassword()" class="btn" style="flex: 1;">確認登入</button>
            </div>
        </div>
    </div>

                "國立高餐大附中", "高雄市私立三信家商", "高雄市私立樹德家商", "高雄市私立中山工商", "高雄市私立高苑工商", "高雄市私立華德工家", "高雄市私立復華高中", "高雄市私立立志高中", "高雄市私立大榮高中", "高雄市立旗美高中",

            ],
            "east_islands": [
                "國立花蓮高商", "國立花蓮農校", "花蓮縣私立上騰工商", "國立花蓮港海事",

                "國立馬公高中",
                "國立金門農工"
            ]
        };

        let db = null;
        let allScores = [];
        let allUsers = {};
        let currentFilter = "all";

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            db.ref("scores").on('value', snapshot => {
                allScores = [];
                const val = snapshot.val();
                if (val) {
                    for (let key in val) {
                        allScores.push(val[key]);
                    }
                }
                refreshLeaderboard();
            });

            db.ref("users").on('value', snapshot => {
                allUsers = snapshot.val() || {};
                refreshLeaderboard();
            });
        } catch (e) {
            console.error("Firebase connection failed", e);
        }

        let pendingUsername = "";
        let pendingPassword = "";

        function handleLogin() {
            const userField = document.getElementById("username").value.trim();
            const passField = document.getElementById("password").value.trim();

            if (!userField || !passField) {
                alert("請填寫帳號與密碼！");
                return;
            }

            pendingUsername = userField.toLowerCase().replace(/[^a-z0-9_-]/g, "");
            if (pendingUsername !== userField.toLowerCase()) {
                alert("帳號格式限用小寫英文、數字、底線或破折號！");
                return;
            }
            pendingPassword = passField;

            if (db) {
                db.ref(`users/${pendingUsername}`).once('value')
                .then(snapshot => {
                    const user = snapshot.val();
                    if (user) {
                        if (user.password === pendingPassword) {
                            saveUserSession(pendingUsername, user.name, user.school, user.unlocked_level || 1);
                        } else {
                            alert("密碼錯誤！請重新輸入。若為首次使用，表示此帳號已被他人註冊，請換一個新帳號。");
                        }
                    } else {
                        document.getElementById("regUsernameLabel").innerText = pendingUsername;
                        document.getElementById("regRegion").value = "";
                        updateSchoolDropdown();
                        document.getElementById("regName").value = "";
                        document.getElementById("registerModal").style.display = "flex";
                    }
                })
                .catch(err => {
                    console.error("Authentication error:", err);
                    alert("連線失敗，請檢查網路連線或稍後再試！");
                });
            } else {
                alert("資料庫連線中，請稍後再試！");
            }
        }

        function updateSchoolDropdown() {
            const region = document.getElementById("regRegion").value;
            const schoolSelect = document.getElementById("regSchool");
            const manualContainer = document.getElementById("regSchoolManualContainer");
            
            manualContainer.style.display = "none";
            document.getElementById("regSchoolManual").value = "";
            schoolSelect.innerHTML = "";

            if (!region) {
                const opt = document.createElement("option");
                opt.value = "";
                opt.innerText = "-- 請先選擇區域 --";
                schoolSelect.appendChild(opt);
                return;
            }

            const optDefault = document.createElement("option");
            optDefault.value = "";
            optDefault.innerText = "-- 請選擇學校 --";
            schoolSelect.appendChild(optDefault);

            const schools = schoolListByRegion[region] || [];
            schools.forEach(sch => {
                const opt = document.createElement("option");
                opt.value = sch;
                opt.innerText = sch;
                schoolSelect.appendChild(opt);
            });

            const optOther = document.createElement("option");
            optOther.value = "other";
            optOther.innerText = "其他學校 (手動輸入)...";
            schoolSelect.appendChild(optOther);
        }

        function checkSchoolManual() {
            const schoolSelect = document.getElementById("regSchool");
            const manualContainer = document.getElementById("regSchoolManualContainer");
            if (schoolSelect.value === "other") {
                manualContainer.style.display = "block";
                document.getElementById("regSchoolManual").focus();
            } else {
                manualContainer.style.display = "none";
                document.getElementById("regSchoolManual").value = "";
            }
        }

        function closeRegisterModal() {
            document.getElementById("registerModal").style.display = "none";
        }

        function submitRegister() {
            const region = document.getElementById("regRegion").value;
            const schoolSelect = document.getElementById("regSchool");
            const name = document.getElementById("regName").value.trim();

            if (!region) {
                alert("請選擇學校區域！");
                return;
            }

            let school = schoolSelect.value;
            if (school === "other") {
                school = document.getElementById("regSchoolManual").value.trim();
            }

            if (!school || !name) {
                alert("請選擇或填寫學校名稱與學生姓名！");
                return;
            }

            if (db) {
                const userData = {
                    password: pendingPassword,
                    school: school,
                    name: name,
                    unlocked_level: 1,
                    registered_at: firebase.database.ServerValue.TIMESTAMP
                };

                db.ref(`users/${pendingUsername}`).set(userData)
                .then(() => {
                    closeRegisterModal();
                    saveUserSession(pendingUsername, name, school, 1);
                })
                .catch(err => {
                    console.error("Registration error:", err);
                    alert("註冊寫入失敗，請檢查網路連線或稍後再試！");
                });
            }
        }

        function saveUserSession(username, name, school, unlockedLevel) {
            localStorage.setItem("game_username", username);
            localStorage.setItem("game_user_name", name);
            localStorage.setItem("game_user_school", school);
            localStorage.setItem("game_unlocked_level", unlockedLevel);
            window.location.href = "game.html";
        }

        function refreshLeaderboard() {
            const tbody = document.getElementById("leaderboardBody");
            tbody.innerHTML = "";

            const studentMap = {};

            for (let uname in allUsers) {
                studentMap[uname] = {
                    username: uname,
                    school: allUsers[uname].school,
                    name: allUsers[uname].name,
                    levelScores: {},
                    totalScore: 0,
                    completedCount: 0
                };
            }

            allScores.forEach(s => {
                const uname = s.username;
                const score = s.score;
                const lvl = s.level;
                
                if (uname && studentMap[uname]) {
                    const student = studentMap[uname];
                    if (!student.levelScores[lvl] || score > student.levelScores[lvl]) {
                        student.levelScores[lvl] = score;
                    }
                }
            });

            const list = [];
            for (let uname in studentMap) {
                const student = studentMap[uname];
                let sum = 0;
                let passed = 0;
                for (let lvl in student.levelScores) {
                    const maxScore = student.levelScores[lvl];
                    sum += maxScore;
                    if (maxScore >= 85) {
                        passed++;
                    }
                }
                student.totalScore = sum;
                student.completedCount = passed;
                
                if (student.totalScore > 0) {
                    list.push(student);
                }
            }

            list.sort((a, b) => {
                if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
                if (b.completedCount !== a.completedCount) return b.completedCount - a.completedCount;
                return a.username.localeCompare(b.username);
            });

            let filtered = list;
            const mySchool = localStorage.getItem("game_user_school");
            
            if (currentFilter === "school") {
                if (!mySchool) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">請先登入，方可查看您的校內排行</td></tr>`;
                    return;
                }
                filtered = list.filter(s => s.school === mySchool);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 30px;">尚無作答分數資料</td></tr>`;
                return;
            }

            filtered.forEach((s, index) => {
                const rank = index + 1;
                let rankHtml = `<span class="rank-cell">${rank}</span>`;
                if (rank === 1) rankHtml = `<span class="rank-cell rank-1">1</span>`;
                else if (rank === 2) rankHtml = `<span class="rank-cell rank-2">2</span>`;
                else if (rank === 3) rankHtml = `<span class="rank-cell rank-3">3</span>`;

                const isMe = (s.username === localStorage.getItem("game_username"));
                const tr = document.createElement("tr");
                if (isMe) {
                    tr.style.background = "rgba(79, 70, 229, 0.08)";
                    tr.style.outline = "1.5px solid var(--primary)";
                }
                
                tr.innerHTML = `
                    <td style="display: flex; justify-content: center; align-items: center; border-bottom: none; height: 44px;">${rankHtml}</td>
                    <td><b>${s.school}</b></td>
                    <td><b>${s.name}</b></td>
                    <td style="text-align: right; color: var(--primary); font-weight: 800;">${s.totalScore} 分</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function switchTab(tab) {
            currentFilter = tab;
            document.getElementById("tabAll").className = `tab-btn ${tab === 'all' ? 'active' : ''}`;
            document.getElementById("tabMySchool").className = `tab-btn ${tab === 'school' ? 'active' : ''}`;
            refreshLeaderboard();
        }

        function openTeacherLogin() {
            if (localStorage.getItem("teacher_authenticated") === "true") {
                window.location.href = "admin.html";
            } else {
                document.getElementById("passwordModal").style.display = "flex";
                document.getElementById("passwordInput").value = "";
                document.getElementById("passwordError").style.display = "none";
                document.getElementById("passwordInput").focus();
            }
        }

        function closePasswordModal() {
            document.getElementById("passwordModal").style.display = "none";
        }

        function submitPassword() {
            const pwd = document.getElementById("passwordInput").value;
            if (pwd === "116") {
                localStorage.setItem("teacher_authenticated", "true");
                window.location.href = "admin.html";
            } else {
                document.getElementById("passwordError").style.display = "block";
            }
        }
    </script>
