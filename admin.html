<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐旅概論雲端檢測系統 - 教師管理後台</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Load Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- Load SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* ================= THEME DEFINITIONS ================= */
        :root, [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #e2e8f0 0%, #f8fafc 85%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(99, 102, 241, 0.2);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --text-main: #0f172a;
            --text-muted: #475569;
            --surface-hover: rgba(79, 70, 229, 0.05);
            --input-bg: #ffffff;
            --table-header: rgba(79, 70, 229, 0.08);
        }

        [data-theme="midnight"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0b0f19 85%);
            --card-bg: rgba(22, 27, 46, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success: #10b981;
            --error: #ef4444;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --surface-hover: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(11, 15, 25, 0.7);
            --table-header: rgba(255, 255, 255, 0.05);
        }

        [data-theme="ocean"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #0c3359 0%, #051324 85%);
            --card-bg: rgba(12, 38, 66, 0.65);
            --card-border: rgba(56, 189, 248, 0.15);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.35);
            --success: #06b6d4;
            --error: #f43f5e;
            --warning: #facc15;
            --text-main: #f0f9ff;
            --text-muted: #7dd3fc;
            --surface-hover: rgba(56, 189, 248, 0.08);
            --input-bg: rgba(5, 19, 36, 0.7);
            --table-header: rgba(56, 189, 248, 0.08);
        }

        [data-theme="forest"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #064e3b 0%, #02241b 85%);
            --card-bg: rgba(6, 60, 46, 0.65);
            --card-border: rgba(52, 211, 153, 0.15);
            --primary: #059669;
            --primary-hover: #047857;
            --primary-glow: rgba(5, 150, 105, 0.35);
            --success: #34d399;
            --error: #fb7185;
            --warning: #fde047;
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --surface-hover: rgba(52, 211, 153, 0.08);
            --input-bg: rgba(2, 36, 27, 0.7);
            --table-header: rgba(52, 211, 153, 0.08);
        }

        [data-theme="sunset"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #4a044e 0%, #1a0320 85%);
            --card-bg: rgba(58, 6, 61, 0.65);
            --card-border: rgba(244, 114, 182, 0.15);
            --primary: #c026d3;
            --primary-hover: #a21caf;
            --primary-glow: rgba(192, 38, 211, 0.35);
            --success: #10b981;
            --error: #f43f5e;
            --warning: #fbbf24;
            --text-main: #fdf4ff;
            --text-muted: #f0abfc;
            --surface-hover: rgba(244, 114, 182, 0.08);
            --input-bg: rgba(26, 3, 32, 0.7);
            --table-header: rgba(244, 114, 182, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 35px 20px;
        }

        .theme-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease;
        }

        .theme-dot:hover { transform: scale(1.15); }
        .theme-dot.active { border-color: var(--primary); transform: scale(1.1); box-shadow: 0 0 8px var(--primary-glow); }

        .dot-light { background: linear-gradient(135deg, #ffffff, #94a3b8); border: 1px solid #cbd5e1; }
        .dot-midnight { background: linear-gradient(135deg, #1e1b4b, #6366f1); }
        .dot-ocean { background: linear-gradient(135deg, #0c3359, #0284c7); }
        .dot-forest { background: linear-gradient(135deg, #064e3b, #10b981); }
        .dot-sunset { background: linear-gradient(135deg, #4a044e, #c026d3); }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary-glow);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .stat-val { font-size: 1.6rem; font-weight: 900; color: var(--text-main); }
        .stat-lbl { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .tabs {
            display: flex;
            background: var(--surface-hover);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 3px 10px var(--primary-glow);
        }

        .search-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--text-main);
            font-size: 0.92rem;
            width: 240px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px var(--primary-glow); }
        .btn-success { background: var(--success); }
        .btn-error { background: var(--error); }
        .btn-outline { background: var(--surface-hover); border: 1px solid var(--card-border); color: var(--text-main); }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            background: var(--surface-hover);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--table-header);
            color: var(--text-muted);
            font-weight: 700;
            padding: 14px 18px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--card-border);
        }

        td {
            padding: 13px 18px;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        tr:hover { background: var(--surface-hover); }

        .progress-badge {
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid var(--primary-glow);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            display: inline-block;
        }

        .reports-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .report-card {
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        @keyframes pulseAlert {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.008); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-bar">
        <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted);">🎨 底色：</span>
        <div class="theme-dot dot-light active" title="晨曦明亮 (預設白色底)" onclick="setTheme('light')"></div>
        <div class="theme-dot dot-midnight" title="星空暗夜" onclick="setTheme('midnight')"></div>
        <div class="theme-dot dot-ocean" title="沉靜湛藍" onclick="setTheme('ocean')"></div>
        <div class="theme-dot dot-forest" title="森林翡翠" onclick="setTheme('forest')"></div>
        <div class="theme-dot dot-sunset" title="暮光幻紫" onclick="setTheme('sunset')"></div>
    </div>

    <div class="container">
        <div class="dashboard-card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 5px;">
                <h1>餐旅概論雲端檢測系統 - 教師後台</h1>
                <div style="display: flex; gap: 10px;">
                    <a href="index.html" class="btn btn-outline">🏠 回首頁</a>
                    <button onclick="logoutAdmin()" class="btn btn-error">退出後台</button>
                </div>
            </div>
            <div class="subtitle">即時掌握全台學生通關進度、管理題目爭議回報與匯出 Excel 成績報表</div>

            <!-- Prominent Pending Reports Alert Banner -->
            <div id="pendingReportsBanner" style="display: none; background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(245,158,11,0.15)); border: 2px solid var(--warning); padding: 18px 22px; border-radius: 18px; margin-top: 15px; margin-bottom: 25px; animation: pulseAlert 2.5s infinite ease-in-out; cursor: pointer;" onclick="switchSection('reports')">
                <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 2.2rem;">🚨</span>
                        <div>
                            <h3 style="color: var(--error); font-weight: 900; margin: 0; font-size: 1.15rem;">待處理提醒：目前系統中有 <span id="bannerReportCount" style="text-decoration: underline; font-size: 1.3rem;">0</span> 筆學生提交的題目問題回報！</h3>
                            <p style="color: var(--text-main); font-size: 0.9rem; margin: 4px 0 0 0;">請點擊此處立即查看學生回報之題目疑義、錯字或答案爭議，並進行核對修改。</p>
                        </div>
                    </div>
                    <button class="btn" style="background: var(--error); color: #fff; font-weight: 800; padding: 10px 18px; font-size: 0.9rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(220,38,38,0.3);">👉 立即進入審核處理</button>
                </div>
            </div>

            <!-- Stats Overview Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div>
                        <div class="stat-val" id="statStudents">0</div>
                        <div class="stat-lbl">已註冊學生總數</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div>
                        <div class="stat-val" id="statAttempts">0</div>
                        <div class="stat-lbl">累積小考測驗次數</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚠️</div>
                    <div>
                        <div class="stat-val" id="statReports" style="color: var(--warning);">0</div>
                        <div class="stat-lbl">待審查問題回報</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="tabs">
                    <button class="tab-btn active" id="tabStudents" onclick="switchSection('students')">學生進度管理</button>
                    <button class="tab-btn" id="tabReports" onclick="switchSection('reports')">題目問題回報 (<span id="reportsCount">0</span>)</button>
                </div>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap;" id="studentControls">
                    <input type="text" class="search-box" id="searchBox" placeholder="搜尋學校或姓名..." oninput="filterData()">
                    <button onclick="exportToExcel()" class="btn btn-success">📊 匯出 Excel 成績表</button>
                </div>
            </div>

            <!-- SECTION 1: Students Progress Table -->
            <div id="studentsSection">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 22%;">學校名稱</th>
                                <th style="width: 18%;">帳號 (帳密備忘)</th>
                                <th style="width: 20%;">姓名 / 暱稱</th>
                                <th style="width: 20%;">目前解鎖進度</th>
                                <th style="width: 20%;">已通關比例</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">等待資料載入中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SECTION 2: Issue Reports List -->
            <div id="reportsSection" style="display: none;">
                <div class="reports-grid" id="reportsContainer">
                    <div style="text-align: center; color: var(--text-muted); padding: 30px;">尚無回報紀錄</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Theme Management - Default to 'light' (White theme)
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('game_theme', theme);
            document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
            const activeDot = document.querySelector(`.dot-${theme}`);
            if (activeDot) activeDot.classList.add('active');
        }

        (function() {
            const savedTheme = localStorage.getItem('game_theme') || 'light';
            setTheme(savedTheme);
        })();

        (function() {
            const auth = localStorage.getItem("teacher_authenticated");
            if (auth !== "true") {
                const password = prompt("請輸入教師管理密碼以進入後端：");
                if (password === "116") {
                    localStorage.setItem("teacher_authenticated", "true");
                } else {
                    alert("密碼錯誤，拒絕存取！");
                    window.location.href = "index.html";
                    throw new Error("Unauthorized access");
                }
            }
        })();

        function logoutAdmin() {
            localStorage.removeItem("teacher_authenticated");
            window.location.href = "index.html";
        }

        // ======= Firebase Configuration =======
        const firebaseConfig = {
            apiKey: "AIzaSyB8NyckuEi1iN2VHsNYhXsWMTq0Ily4bEM",
            authDomain: "hospitality-quiz.firebaseapp.com",
            databaseURL: "https://hospitality-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hospitality-quiz",
            storageBucket: "hospitality-quiz.firebasestorage.app",
            messagingSenderId: "953888535734",
            appId: "1:953888535734:web:00bf350c2f082dcabce217",
            measurementId: "G-GZY13ZLWXV"
        };
        // ======================================

        let db = null;
        let activeSection = "students";
        let rawUsers = {};
        let rawScores = {};
        let rawReports = {};

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val() || {};
                rawUsers = data.users || {};
                rawScores = data.scores || {};
                rawReports = data.reports || {};
                
                document.getElementById("statStudents").innerText = Object.keys(rawUsers).length;
                document.getElementById("statAttempts").innerText = Object.keys(rawScores).length;
                document.getElementById("statReports").innerText = Object.keys(rawReports).length;

                renderStudentsTable();
                renderReports();
            }, (err) => {
                console.error("Firebase read error", err);
            });
        } catch (e) {
            console.error("Firebase init failed", e);
        }

        function switchSection(sec) {
            activeSection = sec;
            document.getElementById("tabStudents").className = `tab-btn ${sec === 'students' ? 'active' : ''}`;
            document.getElementById("tabReports").className = `tab-btn ${sec === 'reports' ? 'active' : ''}`;
            
            if (sec === "students") {
                document.getElementById("studentsSection").style.display = "block";
                document.getElementById("reportsSection").style.display = "none";
                document.getElementById("studentControls").style.display = "flex";
            } else {
                document.getElementById("studentsSection").style.display = "none";
                document.getElementById("reportsSection").style.display = "block";
                document.getElementById("studentControls").style.display = "none";
            }
        }

        function filterData() {
            renderStudentsTable();
        }

        function renderStudentsTable() {
            const tbody = document.getElementById("studentTableBody");
            tbody.innerHTML = "";

            const searchQuery = document.getElementById("searchBox").value.trim().toLowerCase();
            const TOTAL_LEVELS = 32;

            let rowCount = 0;
            for (let uname in rawUsers) {
                const user = rawUsers[uname];
                const name = user.name || "";
                const school = user.school || "";
                const unlocked = user.unlocked_level || 1;

                if (searchQuery && !name.toLowerCase().includes(searchQuery) && !school.toLowerCase().includes(searchQuery) && !uname.toLowerCase().includes(searchQuery)) {
                    continue;
                }

                rowCount++;
                const tr = document.createElement("tr");

                const passedCount = unlocked - 1;
                const completionPct = Math.round((passedCount / TOTAL_LEVELS) * 100);

                tr.innerHTML = `
                    <td><b>${school}</b></td>
                    <td><span style="font-family: monospace;">${uname}</span> <br><small style="color:var(--text-muted);">密碼: ${user.password}</small></td>
                    <td><b>${name}</b></td>
                    <td><span class="progress-badge">已解鎖第 ${unlocked} 關</span></td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="flex: 1; height: 8px; background: var(--input-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--card-border);">
                                <div style="width: ${completionPct}%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 4px;"></div>
                            </div>
                            <span style="font-size: 0.85rem; font-weight: bold; min-width: 60px;">${passedCount} / ${TOTAL_LEVELS} 關</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            if (rowCount === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">未找到匹配的學生資料</td></tr>`;
            }
        }

        function renderReports() {
            const container = document.getElementById("reportsContainer");
            container.innerHTML = "";

            const reportsCountNode = document.getElementById("reportsCount");
            const banner = document.getElementById("pendingReportsBanner");
            const bannerCountNode = document.getElementById("bannerReportCount");
            
            const reportsList = [];
            for (let id in rawReports) {
                reportsList.push({ id: id, ...rawReports[id] });
            }

            reportsList.sort((a,b) => b.reported_at - a.reported_at);
            reportsCountNode.innerText = reportsList.length;

            if (banner && bannerCountNode) {
                if (reportsList.length > 0) {
                    banner.style.display = "block";
                    bannerCountNode.innerText = reportsList.length;
                } else {
                    banner.style.display = "none";
                }
            }

            if (reportsList.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 1.05rem;">🎉 太棒了！目前尚無待處理之題目回報。</div>`;
                return;
            }

            reportsList.forEach(rep => {
                const card = document.createElement("div");
                card.className = "report-card";

                const dateStr = new Date(rep.reported_at).toLocaleString('zh-TW');
                const indexLetters = ["A", "B", "C", "D"];
                const choicesText = rep.choices ? rep.choices.map((c, i) => `(${indexLetters[i]}) ${c}`).join("　") : "";

                card.innerHTML = `
                    <div class="report-header">
                        <div>
                            <span style="background: rgba(217,119,6,0.12); color: var(--warning); border: 1px solid rgba(217,119,6,0.3); padding: 4px 10px; border-radius: 8px; font-size: 0.82rem; margin-right: 8px; font-weight: bold;">${rep.level_title || `第 ${rep.level} 關`}</span>
                            <strong>${rep.school} - ${rep.name} (${rep.username})</strong>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">${dateStr}</span>
                            <button onclick="copyReportInfo('${encodeURIComponent(JSON.stringify(rep))}')" class="btn btn-outline" style="padding: 5px 12px; font-size: 0.78rem;">📋 複製題目資訊</button>
                            <button onclick="deleteReport('${rep.id}')" class="btn btn-error" style="padding: 5px 12px; font-size: 0.78rem;">✓ 標記已修正並結案</button>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 0.92rem; line-height: 1.5;">
                        <div>
                            <strong style="color: var(--primary);">📖 題目與選項內容：</strong>
                            <div style="background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; margin-top: 6px;">
                                <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 6px;">${rep.question}</div>
                                <div style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 6px;">${choicesText}</div>
                                <div style="color: var(--success); font-size: 0.88rem; font-weight: bold;">目前系統標準答案為：(${rep.answer})</div>
                            </div>
                        </div>
                        <div>
                            <strong style="color: var(--error);">🚨 學生回報之問題描述 / 爭議建議：</strong>
                            <div style="background: rgba(220, 38, 38, 0.08); border-left: 4px solid var(--error); padding: 12px 16px; border-radius: 0 12px 12px 0; margin-top: 6px; color: var(--text-main); font-weight: 500;">
                                ${rep.error_desc}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyReportInfo(encodedRep) {
            try {
                const rep = JSON.parse(decodeURIComponent(encodedRep));
                const textToCopy = `【題目問題回報】\n關卡：${rep.level_title}\n題目：${rep.question}\n目前答案：(${rep.answer})\n學生說明：${rep.error_desc}`;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("已複製題目回報詳細資訊至剪貼簿！方便您核對修改題庫。");
                });
            } catch(e) {
                console.error(e);
            }
        }

        function deleteReport(reportId) {
            if (confirm("您確定要將這筆回報標記為已處理並刪除嗎？")) {
                if (db) {
                    db.ref(`reports/${reportId}`).remove()
                    .catch(err => console.error("Delete report failed", err));
                }
            }
        }

        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Excel 匯出元件載入中，請稍後再試！");
                return;
            }

            const scoreList = [];
            for (let id in rawScores) {
                scoreList.push(rawScores[id]);
            }

            const excelData = [];
            const headers = ["學校名稱", "帳號", "姓名/暱稱", "目前解鎖進度"];
            const TOTAL_LEVELS = 32;
            for (let l = 1; l <= TOTAL_LEVELS; l++) {
                headers.push(`第 ${l} 關最高分`);
            }
            excelData.push(headers);

            for (let uname in rawUsers) {
                const user = rawUsers[uname];
                const name = user.name || "";
                const school = user.school || "";
                const unlocked = user.unlocked_level || 1;

                const row = [school, uname, name, `已解鎖第 ${unlocked} 關`];

                for (let l = 1; l <= TOTAL_LEVELS; l++) {
                    const lvlScores = scoreList
                        .filter(s => s.username === uname && s.level === l)
                        .map(s => s.score);
                    
                    if (lvlScores.length > 0) {
                        row.push(Math.max(...lvlScores));
                    } else {
                        row.push("");
                    }
                }
                excelData.push(row);
            }

            const worksheet = XLSX.utils.aoa_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "學生最高小考成績");
            XLSX.writeFile(workbook, "餐旅概論學生小考最高成績表.xlsx");
        }
    </script>
</body>
</html>
