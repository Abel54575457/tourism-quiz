<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐旅概論 - 闖關與全真檢測</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Load Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- Load Question Database -->
    <script src="questions.js"></script>

    <style>
        /* ================= THEME DEFINITIONS ================= */
        :root, [data-theme="midnight"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0b0f19 85%);
            --card-bg: rgba(22, 27, 46, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --success: #10b981;
            --error: #ef4444;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --surface-hover: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(11, 15, 25, 0.7);
            --modal-bg: #15192b;
            --choice-bg: rgba(255, 255, 255, 0.04);
            --choice-border: rgba(255, 255, 255, 0.08);
            --chapter-header-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(30, 27, 75, 0.4));
        }

        [data-theme="ocean"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #0c3359 0%, #051324 85%);
            --card-bg: rgba(12, 38, 66, 0.65);
            --card-border: rgba(56, 189, 248, 0.15);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.35);
            --success: #06b6d4;
            --error: #f43f5e;
            --warning: #facc15;
            --text-main: #f0f9ff;
            --text-muted: #7dd3fc;
            --surface-hover: rgba(56, 189, 248, 0.08);
            --input-bg: rgba(5, 19, 36, 0.7);
            --modal-bg: #092038;
            --choice-bg: rgba(56, 189, 248, 0.04);
            --choice-border: rgba(56, 189, 248, 0.1);
            --chapter-header-bg: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(12, 38, 66, 0.4));
        }

        [data-theme="forest"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #064e3b 0%, #02241b 85%);
            --card-bg: rgba(6, 60, 46, 0.65);
            --card-border: rgba(52, 211, 153, 0.15);
            --primary: #059669;
            --primary-hover: #047857;
            --primary-glow: rgba(5, 150, 105, 0.35);
            --success: #34d399;
            --error: #fb7185;
            --warning: #fde047;
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --surface-hover: rgba(52, 211, 153, 0.08);
            --input-bg: rgba(2, 36, 27, 0.7);
            --modal-bg: #043629;
            --choice-bg: rgba(52, 211, 153, 0.04);
            --choice-border: rgba(52, 211, 153, 0.1);
            --chapter-header-bg: linear-gradient(135deg, rgba(5, 150, 105, 0.2), rgba(6, 60, 46, 0.4));
        }

        [data-theme="sunset"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #4a044e 0%, #1a0320 85%);
            --card-bg: rgba(58, 6, 61, 0.65);
            --card-border: rgba(244, 114, 182, 0.15);
            --primary: #c026d3;
            --primary-hover: #a21caf;
            --primary-glow: rgba(192, 38, 211, 0.35);
            --success: #10b981;
            --error: #f43f5e;
            --warning: #fbbf24;
            --text-main: #fdf4ff;
            --text-muted: #f0abfc;
            --surface-hover: rgba(244, 114, 182, 0.08);
            --input-bg: rgba(26, 3, 32, 0.7);
            --modal-bg: #350438;
            --choice-bg: rgba(244, 114, 182, 0.04);
            --choice-border: rgba(244, 114, 182, 0.1);
            --chapter-header-bg: linear-gradient(135deg, rgba(192, 38, 211, 0.2), rgba(58, 6, 61, 0.4));
        }

        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 15%, #e2e8f0 0%, #f8fafc 85%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(99, 102, 241, 0.2);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.25);
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --text-main: #0f172a;
            --text-muted: #475569;
            --surface-hover: rgba(79, 70, 229, 0.06);
            --input-bg: #ffffff;
            --modal-bg: #ffffff;
            --choice-bg: rgba(241, 245, 249, 0.8);
            --choice-border: rgba(203, 213, 225, 0.8);
            --chapter-header-bg: linear-gradient(135deg, rgba(224, 231, 255, 0.8), rgba(241, 245, 249, 0.9));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        /* Theme Switcher Bar */
        .theme-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease;
        }

        .theme-dot:hover { transform: scale(1.15); }
        .theme-dot.active { border-color: #ffffff; transform: scale(1.1); box-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .dot-midnight { background: linear-gradient(135deg, #1e1b4b, #6366f1); }
        .dot-ocean { background: linear-gradient(135deg, #0c3359, #0284c7); }
        .dot-forest { background: linear-gradient(135deg, #064e3b, #10b981); }
        .dot-sunset { background: linear-gradient(135deg, #4a044e, #c026d3); }
        .dot-light { background: linear-gradient(135deg, #ffffff, #94a3b8); border: 1px solid #cbd5e1; }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        @media (max-width: 768px) {
            .main-card { padding: 22px 18px; border-radius: 22px; }
            body { padding: 60px 10px 30px; }
        }

        /* Top Bar */
        .user-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .user-detail h3 { font-size: 1.05rem; font-weight: 800; }
        .user-detail p { font-size: 0.82rem; color: var(--text-muted); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 18px var(--primary-glow); }
        .btn-outline { background: var(--surface-hover); border: 1px solid var(--card-border); color: var(--text-main); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { background: var(--error); }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: var(--warning); color: #000; }

        /* Mode Selector Switch */
        .mode-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 18px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .mode-options {
            display: flex;
            gap: 8px;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        /* Chapter Section Styling */
        .chapter-group {
            margin-bottom: 28px;
        }

        .chapter-header {
            background: var(--chapter-header-bg);
            border: 1px solid var(--card-border);
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chapter-header h4 {
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .level-card {
            background: var(--surface-hover);
            border: 1.5px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.22s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 86px;
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .level-card.locked {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .level-card.summary-exam {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(245, 158, 11, 0.2));
            border-color: rgba(251, 191, 36, 0.35);
        }

        .level-card.mock-exam {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(5, 150, 105, 0.2));
            border-color: rgba(16, 185, 129, 0.35);
        }

        .level-card.passed::after {
            content: '⭐';
            position: absolute;
            top: 5px;
            right: 6px;
            font-size: 0.75rem;
        }

        .level-number {
            font-size: 1.15rem;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .level-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Gameplay Arena */
        .game-arena {
            display: none;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .question-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary-glow);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .question-text {
            font-size: 1.18rem;
            font-weight: 700;
            line-height: 1.6;
        }

        .audio-play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .choice-btn {
            background: var(--choice-bg);
            border: 1.5px solid var(--choice-border);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .choice-btn:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .choice-key {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--primary);
            flex-shrink: 0;
        }

        /* Result View */
        .result-view {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--surface-hover);
            border: 4px solid var(--primary);
            box-shadow: 0 0 35px var(--primary-glow);
            margin: 0 auto 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-num { font-size: 2.8rem; font-weight: 900; color: var(--text-main); }
        .score-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }

        /* Wrong Questions Review */
        .wrong-section {
            margin-top: 35px;
            text-align: left;
            border-top: 1px solid var(--card-border);
            padding-top: 25px;
        }

        .wrong-card {
            background: var(--surface-hover);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .wrong-q-title {
            font-weight: 800;
            font-size: 1.02rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .wrong-answers-badge {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge-user-ans {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .badge-correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .explanation-box {
            background: var(--input-bg);
            border-left: 3px solid var(--primary);
            padding: 12px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Problem Report Modal */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-bar">
        <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted);">🎨 底色：</span>
        <div class="theme-dot dot-midnight" title="星空暗夜" onclick="setTheme('midnight')"></div>
        <div class="theme-dot dot-ocean" title="沉靜湛藍" onclick="setTheme('ocean')"></div>
        <div class="theme-dot dot-forest" title="森林翡翠" onclick="setTheme('forest')"></div>
        <div class="theme-dot dot-sunset" title="暮光幻紫" onclick="setTheme('sunset')"></div>
        <div class="theme-dot dot-light" title="晨曦明亮" onclick="setTheme('light')"></div>
    </div>

    <div class="container">
        <div class="main-card">
            
            <!-- User Nav Header -->
            <div class="user-nav">
                <div class="user-info">
                    <div class="user-avatar" id="avatarLetter">U</div>
                    <div class="user-detail">
                        <h3 id="displayStudentName">學生姓名</h3>
                        <p id="displayStudentSchool">學校名稱</p>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <a href="index.html" class="btn btn-outline">🏆 回榮譽榜</a>
                    <button onclick="handleLogout()" class="btn btn-danger" style="padding: 8px 12px; font-size: 0.85rem;">登出</button>
                </div>
            </div>

            <!-- VIEW 1: Level Selection Map -->
            <div id="levelSelectView">
                <div class="mode-container">
                    <div>
                        <strong style="font-size: 0.95rem;">🎯 闖關模式</strong>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">選擇作答習慣，滿 85 分過關解鎖下一關</div>
                    </div>
                    <div class="mode-options">
                        <button id="modeRead" class="mode-btn active" onclick="switchMode('reading')">📖 閱讀認字</button>
                        <button id="modeAudio" class="mode-btn" onclick="switchMode('audio')">🎧 聽音辨字</button>
                    </div>
                </div>

                <!-- Chapters Section Hierarchy -->
                <div id="chaptersContainer">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- VIEW 2: Quiz Gameplay Arena -->
            <div id="gameArenaView" class="game-arena">
                <div class="quiz-top-bar">
                    <div>
                        <button onclick="exitToLevelSelect()" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.82rem;">⬅️ 放棄返回</button>
                    </div>
                    <div style="font-weight: 800; font-size: 1.05rem; color: var(--primary);" id="gameLevelHeaderTitle">第 1 關</div>
                    <div>
                        <button onclick="openReportModal()" class="btn btn-warning" style="padding: 6px 12px; font-size: 0.82rem;">⚠️ 問題回報</button>
                    </div>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>

                <div class="question-box">
                    <span class="question-badge" id="qBadge">第 1 / 20 題</span>
                    <div class="question-text" id="questionText">題目載入中...</div>
                    <button id="ttsButton" class="audio-play-btn" style="display: none;" onclick="playQuestionTTS()">🔊 播放題目語音</button>
                </div>

                <div class="choices-grid" id="choicesGrid">
                    <!-- 4 Option Choices -->
                </div>
            </div>

            <!-- VIEW 3: Result Summary -->
            <div id="resultView" class="result-view">
                <div class="score-circle">
                    <div class="score-num" id="finalScore">0</div>
                    <div class="score-label">滿分 100</div>
                </div>
                <h2 style="font-weight: 900; margin-bottom: 8px;" id="resultHeadline">測驗完成！</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px;" id="resultSubtext">過關標準為 85 分</p>

                <div style="display: flex; justify-content: center; gap: 14px; margin-bottom: 25px;">
                    <button onclick="restartLevel()" class="btn btn-outline">🔄 再次挑戰</button>
                    <button id="nextLevelBtn" onclick="goToNextLevel()" class="btn" style="background: var(--success);">⭐ 前往下一關</button>
                    <button onclick="exitToLevelSelect()" class="btn">🗺️ 回關卡地圖</button>
                </div>

                <!-- Wrong Questions Review List -->
                <div id="wrongQuestionsSection" class="wrong-section" style="display: none;">
                    <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 16px; color: var(--warning); display: flex; align-items: center; gap: 8px;">
                        <span>💡</span> 本次錯題精闢解析與複習
                    </h3>
                    <div id="wrongQuestionsList">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Issue Reporting Modal -->
    <div id="reportModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 style="font-weight: 800; margin-bottom: 10px; color: var(--text-main); text-align: center;">🚨 題目問題回報</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px; text-align: center;">發現題目有錯字、答案爭議或語音問題嗎？請描述給老師知道：</p>
            
            <div style="background: var(--surface-hover); border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 15px; color: var(--text-muted);" id="reportPreview">
                當前題目預覽...
            </div>

            <textarea id="reportDesc" class="form-control" style="width: 100%; height: 100px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-main); padding: 12px; font-size: 0.9rem; margin-bottom: 18px; resize: none;" placeholder="請詳述問題原因（例如：答案應該是B、題目少了一個字...）"></textarea>

            <div style="display: flex; gap: 12px;">
                <button onclick="closeReportModal()" class="btn btn-outline" style="flex: 1;">取消</button>
                <button onclick="submitIssueReport()" class="btn" style="flex: 1; background: var(--warning); color: #000;">確認送出回報</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('game_theme', theme);
            document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
            const activeDot = document.querySelector(`.dot-${theme}`);
            if (activeDot) activeDot.classList.add('active');
        }

        (function() {
            const savedTheme = localStorage.getItem('game_theme') || 'midnight';
            setTheme(savedTheme);
        })();

        // ======= Firebase Configuration =======
        const firebaseConfig = {
            apiKey: "AIzaSyB8NyckuEi1iN2VHsNYhXsWMTq0Ily4bEM",
            authDomain: "hospitality-quiz.firebaseapp.com",
            databaseURL: "https://hospitality-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hospitality-quiz",
            storageBucket: "hospitality-quiz.firebasestorage.app",
            messagingSenderId: "953888535734",
            appId: "1:953888535734:web:00bf350c2f082dcabce217",
            measurementId: "G-GZY13ZLWXV"
        };
        // ======================================

        let db = null;
        let currentUser = {
            username: localStorage.getItem("game_username"),
            name: localStorage.getItem("game_user_name"),
            school: localStorage.getItem("game_user_school"),
            unlockedLevel: parseInt(localStorage.getItem("game_unlocked_level") || "1")
        };

        if (!currentUser.username) {
            window.location.href = "index.html";
        }

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            // Realtime sync user unlock progress
            db.ref(`users/${currentUser.username}`).on('value', snapshot => {
                const data = snapshot.val();
                if (data && data.unlocked_level) {
                    currentUser.unlockedLevel = data.unlocked_level;
                    localStorage.setItem("game_unlocked_level", data.unlocked_level);
                    renderChapterGrid();
                }
            });
        } catch (e) {
            console.error("Firebase sync error", e);
        }

        document.getElementById("displayStudentName").innerText = currentUser.name || currentUser.username;
        document.getElementById("displayStudentSchool").innerText = currentUser.school || "全國高中職";
        document.getElementById("avatarLetter").innerText = (currentUser.name ? currentUser.name[0] : "U");

        // Game State
        let currentMode = "reading"; // "reading" or "audio"
        let currentLevel = 1;
        let currentQuestionIndex = 0;
        let currentQuestionsList = [];
        let score = 0;
        let wrongQuestions = [];

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("modeRead").className = `mode-btn ${mode === 'reading' ? 'active' : ''}`;
            document.getElementById("modeAudio").className = `mode-btn ${mode === 'audio' ? 'active' : ''}`;
        }

        function handleLogout() {
            localStorage.removeItem("game_username");
            localStorage.removeItem("game_user_name");
            localStorage.removeItem("game_user_school");
            localStorage.removeItem("game_unlocked_level");
            window.location.href = "index.html";
        }

        // Chapter Group Definitions for UI
        const chapterGroups = [
            { title: "第 1 章：觀光餐旅業導論與基本概念", icon: "📖", range: [1, 9], summaryExamLevel: 42 },
            { title: "第 2 章：觀光餐旅從業人員與職業道德", icon: "👔", range: [10, 15], summaryExamLevel: 43 },
            { title: "第 3 章：餐飲業概論與營運管理", icon: "🍳", range: [16, 26], summaryExamLevel: 44 },
            { title: "第 4 章：旅館業概論與客房客務", icon: "🏨", range: [27, 34], summaryExamLevel: 45 },
            { title: "第 5 章：旅行業概論與遊程規劃", icon: "✈️", range: [35, 41], summaryExamLevel: 46 },
            { title: "🎯 全真歷屆跨章節綜合模擬測驗", icon: "🎓", range: [47, 51], summaryExamLevel: null }
        ];

        function renderChapterGrid() {
            const container = document.getElementById("chaptersContainer");
            container.innerHTML = "";

            chapterGroups.forEach((grp, gIdx) => {
                const groupDiv = document.createElement("div");
                groupDiv.className = "chapter-group";

                const header = document.createElement("div");
                header.className = "chapter-header";
                header.innerHTML = `<h4><span>${grp.icon}</span> ${grp.title}</h4>`;
                groupDiv.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "level-grid";

                // Section Levels
                for (let l = grp.range[0]; l <= grp.range[1]; l++) {
                    const card = document.createElement("div");
                    const isLocked = (l > currentUser.unlockedLevel);
                    const isPassed = (l < currentUser.unlockedLevel);
                    const isMock = (l >= 47);

                    card.className = `level-card ${isLocked ? 'locked' : ''} ${isPassed ? 'passed' : ''} ${isMock ? 'mock-exam' : ''}`;
                    
                    const qData = GAME_QUESTIONS_DATABASE.find(item => item.level === l);
                    const titleText = qData ? qData.title : `第 ${l} 關`;

                    card.innerHTML = `
                        <div class="level-number">${isLocked ? '🔒' : (isMock ? '📝' : l)}</div>
                        <div class="level-title">${titleText}</div>
                    `;

                    if (!isLocked) {
                        card.onclick = () => startLevel(l);
                    }
                    grid.appendChild(card);
                }

                // Add Summary Exam card if applicable
                if (grp.summaryExamLevel) {
                    const sumLevel = grp.summaryExamLevel;
                    const isLocked = (sumLevel > currentUser.unlockedLevel);
                    const isPassed = (sumLevel < currentUser.unlockedLevel);

                    const sumCard = document.createElement("div");
                    sumCard.className = `level-card summary-exam ${isLocked ? 'locked' : ''} ${isPassed ? 'passed' : ''}`;
                    
                    const sumData = GAME_QUESTIONS_DATABASE.find(item => item.level === sumLevel);
                    const sumTitle = sumData ? sumData.title : `第 ${gIdx + 1} 章總測驗`;

                    sumCard.innerHTML = `
                        <div class="level-number" style="color: var(--warning);">${isLocked ? '🔒' : '🏆'}</div>
                        <div class="level-title" style="font-weight:bold; color: var(--warning);">${sumTitle}</div>
                    `;

                    if (!isLocked) {
                        sumCard.onclick = () => startLevel(sumLevel);
                    }
                    grid.appendChild(sumCard);
                }

                groupDiv.appendChild(grid);
                container.appendChild(groupDiv);
            });
        }

        renderChapterGrid();

        // Start Level
        function startLevel(lvl) {
            currentLevel = lvl;
            currentQuestionIndex = 0;
            score = 0;
            wrongQuestions = [];

            const lvlData = GAME_QUESTIONS_DATABASE.find(item => item.level === lvl);
            if (!lvlData || !lvlData.questions) {
                alert("關卡題庫載入失敗！");
                return;
            }

            // Clone questions array
            currentQuestionsList = [...lvlData.questions];

            document.getElementById("levelSelectView").style.display = "none";
            document.getElementById("resultView").style.display = "none";
            document.getElementById("gameArenaView").style.display = "block";

            document.getElementById("gameLevelHeaderTitle").innerText = lvlData.title;

            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestionsList[currentQuestionIndex];
            const total = currentQuestionsList.length;

            document.getElementById("qBadge").innerText = `第 ${currentQuestionIndex + 1} / ${total} 題`;
            document.getElementById("progressBar").style.width = `${((currentQuestionIndex) / total) * 100}%`;

            const qTextNode = document.getElementById("questionText");
            const ttsBtn = document.getElementById("ttsButton");

            if (currentMode === "audio") {
                qTextNode.innerText = "🎧 請聽題目語音作答：";
                ttsBtn.style.display = "inline-flex";
                playQuestionTTS();
            } else {
                qTextNode.innerText = q.q;
                ttsBtn.style.display = "none";
            }

            const choicesGrid = document.getElementById("choicesGrid");
            choicesGrid.innerHTML = "";

            const keys = ["A", "B", "C", "D"];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerHTML = `<span class="choice-key">${keys[idx]}</span> <span>${opt}</span>`;
                btn.onclick = () => selectAnswer(keys[idx], btn);
                choicesGrid.appendChild(btn);
            });
        }

        function playQuestionTTS() {
            const q = currentQuestionsList[currentQuestionIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(q.q);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        function selectAnswer(selectedKey, btnElem) {
            const q = currentQuestionsList[currentQuestionIndex];
            const isCorrect = (selectedKey.toUpperCase() === q.ans.toUpperCase());

            // Disable buttons temporarily
            const allBtns = document.querySelectorAll(".choice-btn");
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                score += 5; // 20 questions = 100 points
                btnElem.style.background = "rgba(16, 185, 129, 0.2)";
                btnElem.style.borderColor = "var(--success)";
            } else {
                btnElem.style.background = "rgba(239, 68, 68, 0.2)";
                btnElem.style.borderColor = "var(--error)";
                wrongQuestions.push({
                    q: q.q,
                    options: q.options,
                    userAns: selectedKey,
                    correctAns: q.ans,
                    exp: q.exp || "暫無考點解析"
                });
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestionsList.length) {
                    renderQuestion();
                } else {
                    finishLevel();
                }
            }, 300);
        }

        function finishLevel() {
            document.getElementById("gameArenaView").style.display = "none";
            document.getElementById("resultView").style.display = "block";

            document.getElementById("finalScore").innerText = score;
            const isPassed = (score >= 85);

            const headline = document.getElementById("resultHeadline");
            const subtext = document.getElementById("resultSubtext");
            const nextBtn = document.getElementById("nextLevelBtn");

            if (isPassed) {
                headline.innerText = "🎉 恭喜通關！";
                headline.style.color = "var(--success)";
                subtext.innerText = `獲得 ${score} 分，順利解鎖下一關！`;
                nextBtn.style.display = "inline-flex";

                // Update unlocked level if new record
                if (currentLevel >= currentUser.unlockedLevel && currentUser.unlockedLevel < 51) {
                    const nextUnlock = currentLevel + 1;
                    currentUser.unlockedLevel = nextUnlock;
                    localStorage.setItem("game_unlocked_level", nextUnlock);
                    if (db) {
                        db.ref(`users/${currentUser.username}/unlocked_level`).set(nextUnlock);
                    }
                }
            } else {
                headline.innerText = "💪 再接再厲！";
                headline.style.color = "var(--warning)";
                subtext.innerText = `本次得分 ${score} 分，需達 85 分才可解鎖下一關！`;
                nextBtn.style.display = "none";
            }

            // Save Score to Firebase
            if (db) {
                const scoreRecord = {
                    username: currentUser.username,
                    name: currentUser.name,
                    school: currentUser.school,
                    level: currentLevel,
                    score: score,
                    completed_at: firebase.database.ServerValue.TIMESTAMP
                };
                db.ref("scores").push(scoreRecord);
            }

            // Render Wrong Questions Review
            const wrongSection = document.getElementById("wrongQuestionsSection");
            const wrongList = document.getElementById("wrongQuestionsList");
            wrongList.innerHTML = "";

            if (wrongQuestions.length > 0) {
                wrongSection.style.display = "block";
                const keys = ["A", "B", "C", "D"];
                wrongQuestions.forEach((wq, i) => {
                    const card = document.createElement("div");
                    card.className = "wrong-card";

                    const optStrings = wq.options.map((o, idx) => `(${keys[idx]}) ${o}`).join("　");

                    card.innerHTML = `
                        <div class="wrong-q-title">${i + 1}. ${wq.q}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">${optStrings}</div>
                        <div class="wrong-answers-badge">
                            <span class="badge-user-ans">您的答案：(${wq.userAns})</span>
                            <span class="badge-correct-ans">正確答案：(${wq.correctAns})</span>
                        </div>
                        <div class="explanation-box">
                            <strong style="color: var(--text-main);">💡 考點解析：</strong> ${wq.exp}
                        </div>
                    `;
                    wrongList.appendChild(card);
                });
            } else {
                wrongSection.style.display = "none";
            }
        }

        function restartLevel() {
            startLevel(currentLevel);
        }

        function goToNextLevel() {
            if (currentLevel < 51) {
                startLevel(currentLevel + 1);
            } else {
                exitToLevelSelect();
            }
        }

        function exitToLevelSelect() {
            document.getElementById("gameArenaView").style.display = "none";
            document.getElementById("resultView").style.display = "none";
            document.getElementById("levelSelectView").style.display = "block";
            renderChapterGrid();
        }

        // Report Issue Modal
        function openReportModal() {
            const q = currentQuestionsList[currentQuestionIndex];
            document.getElementById("reportPreview").innerText = `題目：${q.q}`;
            document.getElementById("reportDesc").value = "";
            document.getElementById("reportModal").style.display = "flex";
        }

        function closeReportModal() {
            document.getElementById("reportModal").style.display = "none";
        }

        function submitIssueReport() {
            const desc = document.getElementById("reportDesc").value.trim();
            if (!desc) {
                alert("請填寫問題原因說明！");
                return;
            }

            const q = currentQuestionsList[currentQuestionIndex];
            const reportData = {
                username: currentUser.username,
                name: currentUser.name,
                school: currentUser.school,
                level: currentLevel,
                level_title: document.getElementById("gameLevelHeaderTitle").innerText,
                question: q.q,
                choices: q.options,
                answer: q.ans,
                error_desc: desc,
                reported_at: firebase.database.ServerValue.TIMESTAMP
            };

            if (db) {
                db.ref("reports").push(reportData)
                .then(() => {
                    alert("感謝您的回報！老師將會在後台儘速審核修正。");
                    closeReportModal();
                })
                .catch(err => {
                    console.error("Report submit failed", err);
                    alert("回報送出失敗，請檢查網路連線！");
                });
            }
        }
    </script>
</body>
</html>
